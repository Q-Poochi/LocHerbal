name: Database Backup

on:
  schedule:
    # Chạy hằng ngày 03:00 UTC (10:00 giờ VN) — tách khỏi giờ cao điểm
    - cron: "0 3 * * *"
  workflow_dispatch: # cho phép chạy tay để test

permissions:
  contents: read

env:
  # pg_dump nên CÙNG version với server (production là PostgreSQL 18.x)
  PG_IMAGE: postgres:18

jobs:
  # PRODUCTION — ưu tiên tuyệt đối.
  backup-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Production DB URL (Railway API)
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
        run: bash .github/scripts/resolve-db-url.sh production "$RUNNER_TEMP/prod_db_url"

      - name: Dump PostgreSQL (production)
        run: |
          set -euo pipefail
          URL=$(cat "$RUNNER_TEMP/prod_db_url")
          TS=$(date -u +%Y%m%d_%H%M%S)
          echo "TIMESTAMP=$TS" >> "$GITHUB_ENV"
          mkdir -p backups
          docker run --rm -e DUMP_URL="$URL" -e TS="$TS" -v "$PWD/backups:/out" \
            ${{ env.PG_IMAGE }} \
            bash -o pipefail -c 'pg_dump "$DUMP_URL" --no-owner --no-privileges | gzip > "/out/locherbal_prod_${TS}.sql.gz"'

      - name: Verify dump integrity (production)
        working-directory: backups
        run: |
          set -euo pipefail
          F="locherbal_prod_${TIMESTAMP}.sql.gz"
          SIZE=$(stat -c%s "$F")
          [ "$SIZE" -gt 2048 ] || { echo "::error::Dump quá nhỏ ($SIZE bytes) — dump lỗi?"; exit 1; }
          gunzip -t "$F"
          TABLES=$(gunzip -c "$F" | grep -c 'CREATE TABLE' || true)
          [ "$TABLES" -ge 30 ] || { echo "::error::Chỉ thấy $TABLES bảng (cần ≥30) — dump không đầy đủ"; exit 1; }
          gunzip -c "$F" | grep -q 'CREATE TABLE public.users'  || { echo "::error::Thiếu bảng users"; exit 1; }
          gunzip -c "$F" | grep -q 'CREATE TABLE public.orders' || { echo "::error::Thiếu bảng orders"; exit 1; }
          gunzip -c "$F" | grep -q '^COPY '                     || { echo "::error::Không có dữ liệu (COPY) trong dump"; exit 1; }
          echo "BACKUP_FILE=backups/$F" >> "$GITHUB_ENV"
          echo "✅ Production backup OK: $F | $SIZE bytes | $TABLES tables"

      - name: Upload backup artifact (production)
        uses: actions/upload-artifact@v4
        with:
          name: locherbal-prod-db-backup-${{ env.TIMESTAMP }}
          path: backups/locherbal_prod_*.sql.gz
          # GitHub giữ artifact tối đa 90 ngày — chỉ là lớp phòng hộ ngắn hạn.
          # Lưu trữ dài hạn phải qua step S3 bên dưới.
          retention-days: 90

      - name: Push to S3-compatible backup storage (optional)
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_S3_ENDPOINT:-}" ] || [ -z "${BACKUP_S3_BUCKET:-}" ] || \
             [ -z "${BACKUP_S3_ACCESS_KEY:-}" ] || [ -z "${BACKUP_S3_SECRET_KEY:-}" ]; then
            echo "⚠️ Chưa set 4 secrets BACKUP_S3_{ENDPOINT,BUCKET,ACCESS_KEY,SECRET_KEY} — backup chỉ nằm trong artifact 90 ngày."
            echo "👉 Nên tạo bucket RIÊNG cho backup (Cloudflare R2 / MinIO / B2 — S3-compatible) rồi set secrets."
            exit 0
          fi
          aws s3 cp "${BACKUP_FILE}" \
            "s3://${BACKUP_S3_BUCKET}/prod/$(basename "$BACKUP_FILE")" \
            --endpoint-url "$BACKUP_S3_ENDPOINT" \
            ${BACKUP_S3_REGION:+--region "$BACKUP_S3_REGION"}
          echo "✅ Đã push backup production lên object storage: s3://${BACKUP_S3_BUCKET}/prod/"

  # STAGING — backup riêng. LƯU Ý: Railway project hiện chỉ có MỘT environment
  # tên "production" (chưa có staging env thật) nên job này resolve cùng DB.
  # Khi tạo environment "staging" trên Railway, đổi tham số dưới thành "staging".
  backup-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Staging DB URL (Railway API)
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
        run: bash .github/scripts/resolve-db-url.sh production "$RUNNER_TEMP/staging_db_url"

      - name: Dump PostgreSQL (staging)
        run: |
          set -euo pipefail
          URL=$(cat "$RUNNER_TEMP/staging_db_url")
          TS=$(date -u +%Y%m%d_%H%M%S)
          echo "TIMESTAMP=$TS" >> "$GITHUB_ENV"
          mkdir -p backups
          docker run --rm -e DUMP_URL="$URL" -e TS="$TS" -v "$PWD/backups:/out" \
            ${{ env.PG_IMAGE }} \
            bash -o pipefail -c 'pg_dump "$DUMP_URL" --no-owner --no-privileges | gzip > "/out/locherbal_staging_${TS}.sql.gz"'

      - name: Verify dump integrity (staging)
        working-directory: backups
        run: |
          set -euo pipefail
          F="locherbal_staging_${TIMESTAMP}.sql.gz"
          SIZE=$(stat -c%s "$F")
          [ "$SIZE" -gt 2048 ] || { echo "::error::Dump quá nhỏ ($SIZE bytes) — dump lỗi?"; exit 1; }
          gunzip -t "$F"
          TABLES=$(gunzip -c "$F" | grep -c 'CREATE TABLE' || true)
          [ "$TABLES" -ge 10 ] || { echo "::error::Chỉ thấy $TABLES bảng — dump không đầy đủ"; exit 1; }
          echo "✅ Staging backup OK: $F | $SIZE bytes | $TABLES tables"

      - name: Upload backup artifact (staging)
        uses: actions/upload-artifact@v4
        with:
          name: locherbal-staging-db-backup-${{ env.TIMESTAMP }}
          path: backups/locherbal_staging_*.sql.gz
          retention-days: 30
