name: Database Backup

on:
  schedule:
    # Chạy hằng ngày 03:00 UTC (10:00 giờ VN) — tách khỏi giờ cao điểm
    - cron: "0 3 * * *"
  workflow_dispatch: # cho phép chạy tay để test

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump PostgreSQL
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          mkdir -p backups
          pg_dump --no-owner --no-privileges "$STAGING_DATABASE_URL" | gzip > "backups/locherbal_${TIMESTAMP}.sql.gz"
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: locherbal-db-backup-${{ env.TIMESTAMP }}
          path: backups/locherbal_*.sql.gz
          retention-days: 30
