name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    environment:
      name: staging
      url: https://api-staging.locherbal.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: LocProject/package-lock.json

      - name: Install & test backend
        working-directory: LocProject
        run: npm ci

      - name: Typecheck
        working-directory: LocProject
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to Railway
        working-directory: LocProject
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          railway up --service "$RAILWAY_SERVICE_ID" --ci
          railway variable set \
            --service "$RAILWAY_SERVICE_ID" \
            DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            DIRECT_URL="${{ secrets.STAGING_DIRECT_URL }}" \
            JWT_ACCESS_SECRET="${{ secrets.STAGING_JWT_ACCESS_SECRET }}" \
            JWT_REFRESH_SECRET="${{ secrets.STAGING_JWT_REFRESH_SECRET }}" \
            VNP_TMN_CODE="${{ secrets.STAGING_VNP_TMN_CODE }}" \
            VNP_HASH_SECRET="${{ secrets.STAGING_VNP_HASH_SECRET }}" \
            VNP_URL="${{ secrets.STAGING_VNP_URL }}" \
            VNP_RETURN_URL="${{ vars.STAGING_VNP_RETURN_URL }}" \
            VNP_IPN_URL="${{ secrets.STAGING_VNP_IPN_URL }}" \
            SMS_PROVIDER="mock" \
            SMS_PROVIDER_API_KEY="${{ secrets.STAGING_SMS_PROVIDER_API_KEY }}" \
            RESEND_API_KEY="${{ secrets.STAGING_RESEND_API_KEY }}" \
            EMAIL_FROM="${{ secrets.STAGING_EMAIL_FROM }}" \
            FRONTEND_URL="${{ vars.STAGING_FRONTEND_URL }}" \
            CORS_ORIGINS="${{ vars.STAGING_FRONTEND_URL }}" \
            GHN_WEBHOOK_TOKEN="${{ secrets.STAGING_GHN_WEBHOOK_TOKEN }}" \
            GHTK_WEBHOOK_TOKEN="${{ secrets.STAGING_GHTK_WEBHOOK_TOKEN }}" \
            API_URL="${{ secrets.STAGING_API_URL }}" \
            NODE_ENV=production \
            S3_ENDPOINT="${{ secrets.STAGING_S3_ENDPOINT }}" \
            S3_REGION="${{ secrets.STAGING_S3_REGION }}" \
            S3_ACCESS_KEY="${{ secrets.STAGING_S3_ACCESS_KEY }}" \
            S3_SECRET_KEY="${{ secrets.STAGING_S3_SECRET_KEY }}" \
            S3_BUCKET="${{ secrets.STAGING_S3_BUCKET }}" \
            S3_PUBLIC_URL="${{ secrets.STAGING_S3_PUBLIC_URL }}" \
            PORT=4000

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-backend]

    environment:
      name: staging
      url: https://staging.locherbal.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: locproject-frontend/package-lock.json

      - name: Install
        working-directory: locproject-frontend
        run: npm ci

      - name: Typecheck
        working-directory: locproject-frontend
        run: npx tsc --noEmit

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy frontend to Railway
        working-directory: locproject-frontend
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          railway up --service "$RAILWAY_SERVICE_ID" --detach
          railway variable set \
            --service "$RAILWAY_SERVICE_ID" \
            NEXT_PUBLIC_API_URL="${{ secrets.STAGING_API_URL }}" \
            JWT_REFRESH_SECRET="${{ secrets.STAGING_JWT_REFRESH_SECRET }}" \
            NODE_ENV=production
